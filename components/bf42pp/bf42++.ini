[general]

; Show a message in the status chat when a player connects to the server
showConnectsInChat = on

; Show player IDs in chat messages, name changes and joins/disconnects
showIDInChat = on

; Show player IDs in kill messages
showIDInKills = on

; Show player IDs in nametags
showIDInNametags = on

; Show who starts a vote or votes in the console
showVoteInConsole = on

; Gradually lower nametags when u get closer to other players
lowerNametags = on

; Sets the color of console.showStats, console.showFPS, etc
debugTextColor = yellow

; Enables some patches that make the game run smoother. This
; may have a very small performance impact on older systems.
; The patches affect the floating point precision the game runs
; with. When playing in multiplayer the time it takes for the
; server to process your input will be decreased.
smootherGameplay = on

; Sets the colors chosen when the ADD BUDDY button is repeatedly clicked on the scoreboard
presetBuddyColors = lime dodgerblue yellow blueviolet

; The game has higher look left/right sensitivity when you are on-foot and moving
; This option enables a workaround that makes the on-foot sensitivity to always be the same
; WARNING: Enabling this may feel unusual because of the decreased sensitivity!
correctedLookSensitivity = on

; Enables scaling of the mouse sensitivity in stationary MG42/Browning to be the same
; as the infantry sensitivity. Affects PCOs with category VCLand and type VTStationaryMG.
stationaryMGInfSensitivity = on

; In aircraft, the freelook button normally blocks pitch, roll and yaw
; entirely, so only the throttle still responds while you look around.
; This option keeps your keyboard and joystick flight axes working during
; freelook. The mouse is deliberately left out, so looking around
; never steers the plane at the same time.
; In multiplayer your client stops reporting freelook while you are
; flying, so the look axes stay local and the server has no means to tell
; which way a pilot is looking, that's the only tradeoff.
dontBlockInputDuringFreeLook = on

; Enable 3D map showing friendly mines. In multiplayer it is only enabled if the server allows it.
enable3DMineMap = on

; Enable 3D map showing heal, ammo, repair points. In multiplayer it is only enabled if the server allows it.
enable3DSupplyMap = on

; Enable 3D map showing controlpoints. In multiplayer it is only enabled if the server allows it.
enable3DControlPointMap = on

; Restart the game faster when the map is changing.
fasterMapchange = on

; Wrap chat messages if longer than this value. Set to 0 to disable. A good value is 42.
; Also increasing chat lines from 4 to 6 by typing 'chattext 6' in console is recommended.
wrapChat = 0

; File format for screenshots. Possible values: png jpg
screenshotFormat = png

; Sets the time it takes for the hit indicator to disappear. Default is 1 second, 0 disables the indicator.
hitIndicatorTime = 1.000000

; Fixes dynamic lighting on animated meshes (soldiers, vehicles). Normally their
; normals are frozen in the pose the mesh was built in, so the lit side of the mesh
; follows the animation around instead of staying towards the sun.
; The matching vertex shader is built into the mod, shaders.rfa is left alone.
fixAnimatedMeshLighting = on

; Allows the game to load unpacked archive data from game dir like BF1942_r executable does.
disableArchiveOnlyMode = off

; The game uses busy waiting to synchronize ticks defined by game.lockFps.
; It puts unnecessary load on the CPU, leading to increased laptop battery drain
; and loud fan noises even on modern PCs (e.g. 1ms of actual work, 7ms of waiting).
; This setting controls the maximum time the game is allowed to spend busy-waiting.
; The preceding time to busy-waiting period will be be spent sleeping in 1ms steps.
; Decrease value to reduce CPU load.
; Increase it if you experience stuttering as a result.
; Values of <=1ms will lead to excessive sleeping and may reduce frame rate stability.
; Set to -1.0 for vanilla behaviour.
; Default value: 0.0015 (1.5ms).
maxTimeToBusyWait = 0.001500

; Sets minimum timer resolution for maxTimeToBusyWait setting.
; Affects the accuracy of Sleep() function.
; Higher values may lead to stutters. Default: 1 (ms).
minTimerResolution = 1


; This section contains the custom buddy colors
; Keys are player names, values are color codes
; The color code may be a webcolor name or in #rgb or #rrggbb format
; playername = colorcode
[buddycolors]


; This section contains the list of players you ignored
[ignorelist]
