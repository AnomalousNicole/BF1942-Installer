;==========================================================================
; === dgVoodoo2 v2.87.4 config for Battlefield 1942 - BF1942-Installer
; === Installed next to BF1942.exe together with dgVoodoo2's D3D8.dll (only used
; === when the PC can't run DXVK). Based on the official 2.87.4 default
; === dgVoodoo.conf; lines marked "BF1942:" differ from the defaults.
; === Sections not listed here ([Glide], [GlideExt], [Debug]) use defaults.
;==========================================================================

Version                              = 0x287

;--------------------------------------------------------------------------

[General]

OutputAPI                            = bestavailable
Adapters                             = all
FullScreenOutput                     = default
FullScreenMode                       = true
; BF1942: keep the aspect ratio if the game resolution differs from the desktop (default: unspecified)
ScalingMode                          = stretched_ar
ProgressiveScanlineOrder             = false
; BF1942: the installer writes the monitor's refresh rate into Video.con, so real
;         refresh rates must be offered to the game (default: false = 60 Hz only)
EnumerateRefreshRates                = true

Brightness                           = 100
Color                                = 100
Contrast                             = 100
InheritColorProfileInFullScreenMode  = true

KeepWindowAspectRatio                = true
CaptureMouse                         = true
CenterAppWindow                      = false
; BF1942: no screen saver / monitor sleep during long matches (default: false)
DisableScreenSaver                   = true

;--------------------------------------------------------------------------

[GeneralExt]

DesktopResolution                    =
DesktopBitDepth                      =
DeframerSize                         = 1
ImageScaleFactor                     = 1
CursorScaleFactor                    = 0
DisplayROI                           =
Resampling                           = bilinear
PresentationModel                    = auto
ColorSpace                           = appdriven
WatermarkDisplayDuration             = 0
FreeMouse                            = false
WindowedAttributes                   =
FullscreenAttributes                 =
FPSLimit                             = 0
Environment                          =
SystemHookFlags                      =

;--------------------------------------------------------------------------

[DirectX]

DisableAndPassThru                  = false

VideoCard                           = internal3D
; BF1942: report 1 GB video memory so the game allows high texture settings.
;         Kept at 1 GB (matches DXVK's d3d9.maxAvailableMemory) - larger values can
;         confuse old 32-bit games (default: 256)
VRAM                                = 1024
; BF1942: 16x anisotropic filtering - the game's own filtering option is basic;
;         matches DXVK's d3d9.samplerAnisotropy = 16 (default: appdriven)
Filtering                           = 16
Mipmapping                          = appdriven
KeepFilterIfPointSampled            = false
Resolution                          = unforced
; BF1942: 4x MSAA - light enough for Intel integrated graphics in this old game,
;         and smooths the jagged edges the game's own option handles poorly.
;         Lower to 2x (or appdriven) if a very old iGPU struggles (default: appdriven)
Antialiasing                        = 4x

; Lets the game (renderer.setFullScreen) and Borderless1942 decide fullscreen vs windowed
AppControlledScreenMode             = true
DisableAltEnterToToggleScreenMode   = true

Bilinear2DOperations                = false
PhongShadingWhenPossible            = false
; Vsync is left to the game's setting (matches DXVK's d3d9.presentInterval = -1)
ForceVerticalSync                   = false
; BF1942: hide the dgVoodoo logo in the corner of the screen (default: true)
dgVoodooWatermark                   = false
FastVideoMemoryAccess               = false
DisableD3DTnLDevice                 = false

;--------------------------------------------------------------------------

[DirectXExt]

AdapterIDType                       =
VendorID                            =
DeviceID                            =
SubsystemID                         =
RevisionID                          =

DefaultEnumeratedResolutions        = all
; BF1942: always offer the desktop (native) resolution, which the installer
;         writes into Video.con (default: empty)
ExtraEnumeratedResolutions          = max
EnumeratedResolutionBitdepths       = all

DitheringEffect                     = high_quality
; BF1942: the installer sets 32-bit colour, so only dither if something
;         still renders in 16-bit (default: forcealways)
Dithering                           = forceon16bit
DitherOrderedMatrixSizeScale        = 0
; BF1942: at least 24-bit depth buffer to reduce flickering on distant
;         terrain and objects on the large maps (default: appdriven)
DepthBuffersBitDepth                = forcemin24bit
Default3DRenderFormat               = auto

MaxVSConstRegisters                 = 256
D3D12BoundsChecking                 = false

NPatchTesselationLevel              = 0

DisplayOutputEnableMask             = 0xffffffff

MSD3DDeviceNames                    = false
RTTexturesForceScaleAndMSAA         = true
SmoothedDepthSampling               = true
DeferredScreenModeSwitch            = false
PrimarySurfaceBatchedUpdate         = false
SuppressAMDBlacklist                = false
