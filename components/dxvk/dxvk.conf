# Input latency — keeps the CPU from queueing frames ahead
d3d9.maxFrameLatency = 1

# Let the in-game vsync setting apply (-1 = don't override)
d3d9.presentInterval = -1

# BF1942's own AF control is primitive; force it here instead
d3d9.samplerAnisotropy = 16

# Exclusive fullscreen. False = borderless-style, alt-tab safe, no FreeSync.
# Set True if you want VRR, but it breaks alt-tab and GDI windows.
dxvk.allowFse = False

d3d9.maxAvailableMemory = 1024

# Uncomment to confirm DXVK is actually loaded
# dxvk.hud = version,devinfo,fps